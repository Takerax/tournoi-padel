<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournoi de padel – 16 équipes</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--surf:#fff;--ink:#0f1f3d;--mut:#5b6b8a;--court:#1e56c8;--ball:#c8e63c;--line:#cdd8ec;--bad:#c0392b;--ok:#17803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1424;--surf:#14203a;--ink:#e8eefb;--mut:#92a3c5;--court:#6c9cff;--line:#2a3a5e;--bad:#ff7b6b;--ok:#5fd68a}}
:root[data-theme="dark"]{--bg:#0c1424;--surf:#14203a;--ink:#e8eefb;--mut:#92a3c5;--court:#6c9cff;--line:#2a3a5e;--bad:#ff7b6b;--ok:#5fd68a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.45}
header{padding:28px 20px 12px;max-width:1100px;margin:auto}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;margin:0;letter-spacing:-.02em;line-height:1}
h1 span{background:var(--ball);color:#0f1f3d;padding:0 .2em;border-radius:.2em}
header p{color:var(--mut);margin:.6em 0 0}
nav{display:flex;gap:6px;max-width:1100px;margin:12px auto;padding:0 20px;flex-wrap:wrap}
nav button,.btn{font:inherit;font-weight:600;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.btn.p{background:var(--court);border-color:var(--court);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--court);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:8px 20px 60px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 18px;color:var(--mut)}
select,input[type=text]{font:inherit;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.box{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.box h2{margin:0 0 10px;font-size:1.25rem}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.teams label{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.9rem}.teams input{flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}th{color:var(--mut);font-weight:600}
tr.q td{font-weight:800}tr.q td:first-child{box-shadow:inset 4px 0 var(--ball)}
.m{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:9px 0;border-bottom:1px solid var(--line)}

.sc{display:flex;flex-direction:column;gap:4px}
.sc div{display:flex;gap:4px}
.sc input{width:42px;padding:5px 2px;text-align:center;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}

.msg{grid-column:1/-1;font-size:.8rem;color:var(--bad)}
.br{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:20px;overflow-x:auto;align-items:center;padding-bottom:8px}
.br h3{margin:0 0 8px}.br .box{margin-bottom:14px;padding:10px 14px}
.champ{text-align:center;font-size:1.6rem;font-weight:800;background:var(--ball);color:#0f1f3d;border-radius:14px;padding:14px;margin-top:16px}
.seed{color:var(--mut);font-size:.75rem;font-weight:400;margin-right:4px}.note{color:var(--mut);font-size:.85rem}

.tree{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(60px,auto);width:1180px}#fitw{overflow:hidden}.sct{font-weight:800;font-variant-numeric:tabular-nums}.rk td{min-width:0!important}
.tree h3{grid-row:1;margin:0 0 6px;padding:0 18px;font-size:1rem}
.cell{position:relative;padding:4px 18px;display:flex;align-items:center}
.mt{width:100%;background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px}
.mtt{font-size:.72rem;color:var(--mut);margin-bottom:2px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 0;font-size:.9rem}
.tr>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.w{font-weight:800}.tr.w>span:first-child::after{content:" ✓";color:var(--ok)}
.tr.ph{color:var(--mut);font-style:italic}
.ss{display:flex;gap:3px}
.ss input{width:34px;padding:4px 0;text-align:center;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem}
.ss input.bad{border-color:var(--bad)}.ss input:disabled{opacity:.35}
.cr,.cl,.vd,.vu{position:absolute;pointer-events:none}
.cr{right:0;top:50%;width:18px;border-top:2px solid var(--line)}
.cl{left:0;top:50%;width:18px;border-top:2px solid var(--line)}
.vd{right:0;top:50%;bottom:0;border-right:2px solid var(--line)}
.vu{right:0;top:0;bottom:50%;border-right:2px solid var(--line)}
.warn{background:var(--surf);border:1.5px solid var(--bad);border-radius:10px;padding:8px 12px;color:var(--ink)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cfgi input{font:inherit;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);width:80px}
.pl th,.pl td{text-align:left!important;vertical-align:top;padding:8px;border:1px solid var(--line);min-width:250px;font-size:.88rem}
.pl td:first-child,.pl th:first-child{min-width:60px}.pl .tw{font-weight:800}.pl .mtt{color:var(--ink);font-size:.82rem}.pl .mtt b{font-weight:800}.pl .ph{color:var(--mut)}
.avr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.avr>span:first-child{width:80px;font-weight:600}
.avp input{font:inherit;padding:4px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--surf);color:var(--ink)}.avp .x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:1rem}
.wt{color:var(--mut);font-size:.75rem;font-weight:400}
.ln{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:1px 0}
</style>
</head>
<body>
<header>
<h1>Tournoi de <span>padel</span></h1>
<p>16 équipes · élimination directe · tirage au sort étape par étape</p>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="app"></main>
<script>
const FMT={'1x9':'1 set de 9 jeux','2x6':'2 sets gagnants à 6 jeux (7 si 6-6)'};
const fresh=()=>({names:Array.from({length:16},(_,i)=>'Équipe '+(i+1)),d:{},v:2,fmt:{e:'1x9',l:'1x9',c:'1x9'},sc:{},sg:{},cls:'full',act:{},run:{},live:false,cfg:{av:{},qrot:4,courts:4,start:'09:00',d1:40,d2:75,mode:'opt'},tab:'bracket'});
let S=fresh(),pend=null;
try{const r=localStorage.getItem('padel16c');if(r)S=Object.assign(fresh(),JSON.parse(r));const F=fresh();S.fmt=Object.assign(F.fmt,S.fmt);S.cfg=Object.assign(F.cfg,S.cfg);if(+S.cfg.qrot>4)S.cfg.qrot=4;if(S.v!==2){S.fmt=Object.assign({},F.fmt);S.cfg.d1=F.cfg.d1;S.v=2}if(!S.live){S.act={};S.run={}}}catch(e){}
const save=()=>{try{localStorage.setItem('padel16c',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=i=>`<span><small style="color:var(--mut)">#${i+1}</small> ${esc(S.names[i])}</span>`;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ids=p=>[0,1,2,3].map(i=>p+i);
const AFTER={1:[...ids('a'),...ids('b'),...ids('q'),'s0','s1','f'],2:[...ids('b'),...ids('q'),'s0','s1','f'],3:[...ids('q'),'s0','s1','f']};

function setOK(f,a,b){
  const hi=Math.max(a,b),lo=Math.min(a,b);
  if(f==='1x9')return hi===9&&lo<=8;
  return (hi===6&&lo<=4)||(hi===7&&(lo===5||lo===6));
}
function result(key,f){
  const raw=S.sc[key]||[],sets=f==='1x9'?1:3;
  let wa=0,wb=0,err=null,w=null;
  for(let i=0;i<sets;i++){
    const s=raw[i]||[],a=s[0],b=s[1];
    if(a===''||a==null||b===''||b==null)continue;
    if(w!==null){err='Le match est déjà terminé.';break}
    if(!setOK(f,+a,+b)){err=f==='1x9'?'Score invalide (ex. 9-5, 9-8).':'Set '+(i+1)+' invalide (6-0 à 6-4, 7-5, 7-6).';break}
    if(f==='1x9'){w=+a>+b?0:1}else{+a>+b?wa++:wb++;if(wa===2)w=0;if(wb===2)w=1}
  }
  return{w:err?null:w,err};
}
const fOf=k=>/^[ab]/.test(k)?S.fmt.e:k[0]==='c'?(S.fmt.c||'1x9'):S.fmt.l;
const CD={c3:['L','s0','s1'],c5a:['L','q0','q1'],c5b:['L','q2','q3'],c5:['W','c5a','c5b'],c7:['L','c5a','c5b'],c9a:['L','b0','b1'],c9b:['L','b2','b3'],c9:['W','c9a','c9b'],c11:['L','c9a','c9b'],c13a:['L','a0','a1'],c13b:['L','a2','a3'],c13:['W','c13a','c13b'],c15:['L','c13a','c13b']};
const ORDER=['a0','a1','a2','a3','c13a','c13b','b0','b1','b2','b3','c13','c15','c9a','c9b','q0','q1','q2','q3','c9','c11','c5a','c5b','s0','s1','c5','c7','c3','f'];
const actv=k=>k[0]!=='c'||S.cls==='full'||(S.cls==='third'&&k==='c3');
const DEP=k=>k[0]==='c'?CD[k].slice(1):k[0]==='a'?[]:k[0]==='b'?['a'+k[1]]:k[0]==='q'?['b'+k[1]]:k==='s0'?['q0','q1']:k==='s1'?['q2','q3']:['s0','s1'];
function Lz(k){const[a,b]=tm(k),w=W(k);return w==null?null:(w===a?b:a)}
function prune(){for(const k of ORDER){
  if(!(S.sc[k]||[]).some(x=>x&&(x[0]!==''||x[1]!==''))){continue}
  const g=JSON.stringify(tm(k));
  if(S.sg[k]===undefined)S.sg[k]=g;else if(S.sg[k]!==g){delete S.sc[k];delete S.sg[k]}
}}
const TT=k=>({c3:'Match pour la 3e place',c5a:'Place 5-8 · match 1',c5b:'Place 5-8 · match 2',c5:'Match pour la 5e place',c7:'Match pour la 7e place',c9a:'Place 9-12 · match 1',c9b:'Place 9-12 · match 2',c9:'Match pour la 9e place',c11:'Match pour la 11e place',c13a:'Place 13-16 · match 1',c13b:'Place 13-16 · match 2',c13:'Match pour la 13e place',c15:'Match pour la 15e place',s0:'Demi-finale 1',s1:'Demi-finale 2',f:'Finale'}[k]||({a:'Tour 1',b:'Tour 2',q:'Quart'}[k[0]]+' · match '+(+k[1]+1)));
const toMin=t=>{const[h,m]=(t||'09:00').split(':').map(Number);return h*60+(m||0)};
const hhmm=m=>{const t=(m+toMin(S.cfg.start))%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const courtWins=C=>[...Array(C).keys()].map(c=>{const L=(S.cfg.av||{})[c];if(!L||!L.length)return[[0,1e9]];const o=toMin(S.cfg.start);return L.map(w=>[toMin(w.a)-o,toMin(w.b)-o]).filter(w=>w[1]>w[0]&&w[1]>0).map(w=>[Math.max(0,w[0]),w[1]])});
const snap=t=>{const o=toMin(S.cfg.start);return Math.ceil((t+o)/30)*30-o};
const okSlot=(W,t,d)=>W.some(w=>t>=w[0]&&t+d<=w[1]);
function fit(k,Ws,busy,done,min){
  const d=dur(k),ds=DEP(k).filter(actv);
  if(ds.some(x=>done[x]===undefined))return null;
  const rd=Math.max(min,0,...ds.map(x=>done[x]));let best=null;
  for(let c=0;c<Ws.length;c++){
    const cand=[rd,...busy[c].map(b=>b.e),...Ws[c].map(w=>w[0])].filter(e=>e>=rd).sort((a,b)=>a-b);
    const t=cand.find(t=>okSlot(Ws[c],t,d)&&busy[c].every(b=>t+d<=b.s||t>=b.e));
    if(t!==undefined&&(!best||t<best.t))best={c,t,e:t+d};
  }
  return best;
}
const xRot=C=>{const ex=Math.min(1,Math.max(0,(+S.cfg.qrot||3)-3));return S.cls!=='full'?[]:['c13a','c13b','c9a','c9b'].slice(0,Math.min(4,ex*C))};
const prefix=C=>[...ids4('a'),...ids4('b'),...xRot(C),...ids4('q')];
function tidy(out,fx,Ws){
  const ok=()=>{const by={};out.forEach(m=>(by[m.c]=by[m.c]||[]).push(m));
    return out.every(m=>okSlot(Ws[m.c],m.s,m.e-m.s))&&Object.values(by).every(L=>{L.sort((a,b)=>a.s-b.s);return L.every((m,i)=>!i||L[i-1].e<=m.s)})};
  const g={};out.forEach(m=>{if(!fx[m.k])(g[m.s]=g[m.s]||[]).push(m)});
  for(const s in g){const G=g[s];if(G.length<2)continue;
    const old=G.map(m=>m.c),cs=[...old].sort((a,b)=>a-b),ord=[...G.filter(m=>m.k[0]!=='c'),...G.filter(m=>m.k[0]==='c')];
    ord.forEach((m,i)=>{m.c=cs[i]});
    if(!ok())G.forEach((m,i)=>{m.c=old[i]});
  }
}
function commit(k,b,busy,done,out){busy[b.c].push({s:b.t,e:b.e});done[k]=b.e;out.push({k,c:b.c,s:b.t,e:b.e})}
function planPrio(){
  const C=Math.max(1,Math.min(12,+S.cfg.courts||1)),Ws=courtWins(C),busy=Array.from({length:C},()=>[]),done={},out=[],fail=[];
  const place=(k,min=0)=>{const b=fit(k,Ws,busy,done,min);if(b)commit(k,b,busy,done,out);else if(!fail.includes(k))fail.push(k)};
  const mx=ks=>Math.max(0,...ks.map(k=>done[k]||0));
  const XR=xRot(C),PRI=['c5a','c5b','c9a','c9b','c13a','c13b','c5','c7','c9','c11','c13','c15'].filter(actv).filter(k=>!XR.includes(k));
  prefix(C).forEach(k=>place(k));
  const b1=mx(ids4('q'));
  const rot=PRI.filter(k=>DEP(k).every(d=>d in done)).slice(0,C);
  rot.forEach(k=>place(k,b1));
  const b2=Math.max(b1,mx(rot));
  place('s0',b2);place('s1',b2);
  if(actv('c3'))place('c3',b2);
  place('f',b2);
  PRI.filter(k=>!(k in done)).forEach(k=>place(k,b2));
  tidy(out,{},Ws);out.fail=fail;return out;
}
const ids4=p=>[0,1,2,3].map(i=>p+i);
const dur=k=>fOf(k)==='1x9'?(+S.cfg.d1||45):(+S.cfg.d2||75);
function fixedMap(C){
  const F={},o=toMin(S.cfg.start);let now=0;
  for(const k of ORDER){const a=(S.act||{})[k]||(S.run||{})[k];if(!actv(k)||!a||!a.s)continue;
    const st=toMin(a.s)-o;let e=a.e?toMin(a.e)-o:null;if(e!=null&&e<=st)e=null;
    now=Math.max(now,st,e||0);F[k]={c:Math.min(+a.c||0,C-1),s:st,e,run:e==null}}
  for(const k in F)if(F[k].run)F[k].e=Math.max(F[k].s+dur(k),now);
  return{F,now};
}
function sim(order,C,pre=0,tidyIt=false){
  const Ws=courtWins(C),busy=Array.from({length:C},()=>[]),done={},out=[],fail=[],{F,now}=fixedMap(C);
  for(const k of ORDER)if(F[k])commit(k,{c:F[k].c,t:F[k].s,e:F[k].e},busy,done,out);
  let fl=0;
  for(const [n,k] of order.entries()){
    if(F[k])continue;
    const b=fit(k,Ws,busy,done,Math.max(n>=pre?fl:0,now));
    if(!b){fail.push(k);continue}
    commit(k,b,busy,done,out);if(n<pre)fl=Math.max(fl,b.t);
  }
  if(tidyIt)tidy(out,F,Ws);
  out.fail=fail;return out;
}
function edges(P){const m={},g=[];P.forEach(x=>m[x.k]=x);P.forEach(x=>DEP(x.k).filter(actv).forEach(d=>{if(m[d])g.push({k:x.k,d,w:x.s-m[d].e})}));return g}
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let _pc={};
function planOpt(){
  const C=Math.max(1,Math.min(12,+S.cfg.courts||1)),key=JSON.stringify([C,S.cfg.d1,S.cfg.d2,S.cls,S.fmt,S.cfg.av,S.cfg.start,S.cfg.qrot,S.act,S.run]);
  if(_pc.k===key)return _pc.v;
  let cap=Math.max(...planPrio().map(m=>m.e))*1.06;
  const cost=P=>{const mk=Math.max(...P.map(m=>m.e));let c=mk;edges(P).forEach(e=>c+=e.w*e.w);return c+(mk>cap?1e7*(mk-cap):0)+1e9*P.fail.length};
  const PF=prefix(C),P0=PF.length;
  let bestAll=null,bestAllC=Infinity;
  const hasA=hasLive();
  for(let run=0;run<(hasA?1:2);run++){const rnd=rng(7+run*101);let cur=(hasA&&_pc.o&&_pc.o.length===ORDER.filter(actv).length&&PF.every((k,i)=>_pc.o[i]===k))?_pc.o:[...PF,...ORDER.filter(actv).filter(k=>!PF.includes(k))];if(hasA)cap=Math.max(...sim(cur,C,P0).map(m=>m.e))*1.03;let curC=cost(sim(cur,C,P0)),best=cur,bestC=curC;const N=hasA?2000:3500;
  for(let it=0;it<N;it++){
    const n=cur.length,i=P0+Math.floor(rnd()*(n-P0)),k=cur[i],rest=cur.filter((_,x)=>x!==i);
    const lo=Math.max(P0-1,...DEP(k).filter(actv).map(d=>rest.indexOf(d)))+1;
    let hi=n;rest.forEach((x,idx)=>{if(idx<hi&&DEP(x).filter(actv).includes(k))hi=idx});
    const j=lo+Math.floor(rnd()*(hi-lo+1)),cand=[...rest.slice(0,j),k,...rest.slice(j)],c=cost(sim(cand,C,P0));
    if(c<=curC||rnd()<Math.exp((curC-c)/(hasA?40:3000*(1-it/N)+1))){cur=cand;curC=c;if(c<bestC){best=cand;bestC=c}}
  }
  if(bestC<bestAllC){bestAllC=bestC;bestAll=best}}
  _pc={k:key,o:bestAll,v:sim(bestAll,C,P0,true)};return _pc.v;
}
const hasLive=()=>Object.keys(S.act||{}).length+Object.keys(S.run||{}).length>0;
const cnum=()=>Math.max(1,Math.min(12,+S.cfg.courts||1));
const pad2=n=>String(n).padStart(2,'0');
const clockNow=()=>{const n=new Date();return pad2(n.getHours())+':'+pad2(n.getMinutes())};
const hm=m=>{m=((m%1440)+1440)%1440;return pad2(Math.floor(m/60))+':'+pad2(m%60)};
const clockHalf=()=>hm(Math.ceil(toMin(clockNow())/30)*30);
const r30=v=>{if(!v)return v;const[h,m]=v.split(':').map(Number);return hm(Math.round((h*60+m)/30)*30)};
const teamsKnown=k=>tm(k).every(x=>x!=null);
const doneK=k=>teamsKnown(k)&&res(k).w!==null;
function dispatch(){
  const C=cnum(),ru=S.run,busyC=new Set(Object.values(ru).map(r=>r.c)),free=[...Array(C).keys()].filter(c=>!busyC.has(c));

  else if(d.reset){pend={t:'reset'};S.tab='bracket';render()}
  else if(d.avadd!=null){S.cfg.av=S.cfg.av||{};(S.cfg.av[d.avadd]=S.cfg.av[d.avadd]||[]).push({a:S.cfg.start,b:'20:00'});render()}
  else if(d.avdel){const[c,j]=d.avdel.split(':');S.cfg.av[c].splice(+j,1);render()}
  else if(d.avall){const A=S.cfg.av||{},C=+S.cfg.courts||1;for(let c=1;c<C;c++)A[c]=(A[0]||[]).map(w=>({...w}));S.cfg.av=A;render()}
  else if(d.live!=null){if(d.live==='1'){S.live=true;S.cfg.start=clockNow();S.act={};S.run={};syncLive()}else{S.live=false;S.act={};S.run={}}render()}
  else if(d.no){pend=null;render()}
  else if(d.ok){if(pend.t==='reset')S=fresh();else doDraw(pend.n);pend=null;render()}
});
document.addEventListener('change',e=>{
  const x=e.target;
  if(x.dataset.name!=null){S.names[+x.dataset.name]=x.value.trim()||'Équipe '+(+x.dataset.name+1);render()}
  else if(x.dataset.fmt){S.fmt[x.dataset.fmt]=x.value;render()}
  else if(x.dataset.av){const[c,j,f]=x.dataset.av.split(':');S.cfg.av[c][j][f]=r30(x.value);render()}
  else if(x.dataset.cls){S.cls=x.value;render()}
  else if(x.dataset.cfg){S.cfg[x.dataset.cfg]=x.type==='number'?+x.value:(x.type==='time'?r30(x.value):x.value);render()}
  else if(x.dataset.k){
    const k=x.dataset.k,s=+x.dataset.s,t=+x.dataset.t,before=W(k);
    S.sc[k]=S.sc[k]||[];S.sc[k][s]=S.sc[k][s]||['',''];S.sc[k][s][t]=x.value;
    S.sg[k]=JSON.stringify(tm(k));prune();syncLive();
    render();
  }
});
render();
</script>
</body>
</html>
